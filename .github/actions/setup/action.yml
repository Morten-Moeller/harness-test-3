name: Setup
description: >-
  Project-owned toolchain setup for the quality gates: Go for the backend, Node with pnpm for
  the frontend, and the stack-neutral tools for make sast and make deps. golangci-lint, sqlc and
  oapi-codegen run through go run with the versions pinned in the Makefile.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      with:
        version: 12.18.0

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: frontend/.nvmrc
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: |
        (cd backend && go mod download)
        (cd frontend && pnpm install --frozen-lockfile)

    - name: Install semgrep
      shell: bash
      run: pipx install semgrep

    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.21.2
      run: |
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C /usr/local/bin gitleaks

    - name: Install osv-scanner
      shell: bash
      env:
        OSV_VERSION: v2.0.2
      run: |
        curl -sSL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
        chmod +x /usr/local/bin/osv-scanner
