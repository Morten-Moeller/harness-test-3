name: Setup
description: >-
  Project-owned toolchain setup for the quality gates. Fill the TODO steps with the project's
  runtime and dependency install. The last steps install the stack-neutral tools for make sast
  and make deps; keep them or replace them with the project's own.

runs:
  using: composite
  steps:
    # TODO: runtime and dependencies of the project, for example:
    # - uses: actions/setup-node@v4
    #   with:
    #     node-version-file: .nvmrc
    #     cache: pnpm
    # - run: pnpm install --frozen-lockfile
    #   shell: bash

    - name: Install semgrep
      shell: bash
      run: pipx install semgrep

    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.21.2
      run: |
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C /usr/local/bin gitleaks

    - name: Install osv-scanner
      shell: bash
      env:
        OSV_VERSION: v2.0.2
      run: |
        curl -sSL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
        chmod +x /usr/local/bin/osv-scanner
